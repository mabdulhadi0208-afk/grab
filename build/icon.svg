<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Grab 2.0: the Lumen family icon. Lumen's gradient and nebula, a glass tray, and a lit arrow dropping into it. -->
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#3f63ff"/>
      <stop offset="0.5" stop-color="#7440f0"/>
      <stop offset="1" stop-color="#f04d98"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0.42" cy="1.08" r="0.82">
      <stop offset="0" stop-color="#0f0a46" stop-opacity="0.82"/>
      <stop offset="0.55" stop-color="#0f0a46" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0f0a46" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash" cx="0.78" cy="0.2" r="0.62">
      <stop offset="0" stop-color="#7ff0ff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#7ff0ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7ff0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom" cx="0.1" cy="0.06" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="backlight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#7ff0ff" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#d9e0ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d9e0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#d9e0ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#7ff0ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd6f1" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="0" y1="236" x2="0" y2="600">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#eef1ff"/>
      <stop offset="1" stop-color="#cfe9ff"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0f0a46" flood-opacity="0.45"/></filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="190"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#nebula)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#wash)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#bloom)"/>
    <g fill="#ffffff">
      <circle cx="232" cy="262" r="5" opacity=".7"/><circle cx="782" cy="214" r="4" opacity=".8"/><circle cx="836" cy="402" r="3" opacity=".6"/>
      <circle cx="196" cy="520" r="3" opacity=".5"/><circle cx="690" cy="300" r="2.5" opacity=".6"/><circle cx="318" cy="182" r="2.5" opacity=".5"/>
      <path d="M770 300 Q770 318 788 318 Q770 318 770 336 Q770 318 752 318 Q770 318 770 300Z" opacity=".9"/>
    </g>
    <ellipse cx="512" cy="600" rx="270" ry="210" fill="url(#backlight)" filter="url(#soft)" opacity=".75"/>
  </g>
  <rect x="104" y="104" width="816" height="816" rx="186" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="6"/>
  <!-- the glass tray -->
  <g filter="url(#drop)">
    <path d="M262 600 h120 l40 66 h180 l40 -66 h120 v120 a64 64 0 0 1 -64 64 H326 a64 64 0 0 1 -64 -64z" fill="url(#tray)"/>
    <path d="M262 600 h120 l40 66 h180 l40 -66 h120 v120 a64 64 0 0 1 -64 64 H326 a64 64 0 0 1 -64 -64z" fill="none" stroke="url(#rim)" stroke-width="14" stroke-linejoin="round"/>
  </g>
  <!-- the arrow, dropping in -->
  <g filter="url(#drop)" fill="none" stroke="url(#arrow)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 236 V560" stroke-width="84"/>
    <path d="M378 432 L512 566 L646 432" stroke-width="84"/>
  </g>
  <path d="M496 250 V420" stroke="#ffffff" stroke-opacity=".9" stroke-width="12" stroke-linecap="round"/>
</svg>
