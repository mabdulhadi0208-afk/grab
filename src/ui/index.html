<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grab</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="drag"></div>
      <div class="brand">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".55" stop-color="#4F7BFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs>
          <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lg)"/>
          <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M32 15v24"/><path d="M22 30l10 10 10-10"/><path d="M17 45v2a3 3 0 0 0 3 3h24a3 3 0 0 0 3-3v-2"/></g>
        </svg>
        <span>Grab</span>
      </div>
      <nav class="nav"><i class="nav-ind" id="nav-ind"></i>
        <button class="nav-btn active" data-view="discover"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>Discover</span></button>
        <button class="nav-btn" data-view="updates"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg><span>Updates</span><b class="badge" id="badge-updates"></b></button>
        <button class="nav-btn" data-view="installed"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/></svg><span>Installed</span></button>
        <button class="nav-btn" data-view="downloads"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19h14"/></svg><span>Downloads</span><b class="badge live" id="badge-downloads"></b></button>
      </nav>
      <div class="side-fill"></div>
      <div class="self-card" id="self-card" hidden>
        <div class="self-title" id="self-title">Update</div>
        <div class="self-bar"><i id="self-fill"></i></div>
        <button class="btn btn-solid small" id="self-btn">Update Grab</button>
      </div>
      <div class="side-foot" id="side-foot">Loading catalog</div>
    </aside>

    <main class="main">
      <header class="top">
        <label class="search" id="search-wrap">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
          <input id="q" type="text" placeholder="Search any app, or paste a download link" autocomplete="off" spellcheck="false">
          <kbd id="kbd"></kbd>
          <button class="clear" id="clear" title="Clear" hidden><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
        </label>
      </header>
      <section class="view" id="view"></section>
      <i class="blob" id="blob"></i><i class="scrollbar-glow" id="sglow"></i>
    </main>
  </div>

  <div class="sheet-back" id="sheet-back" hidden></div>
  <aside class="sheet" id="sheet" hidden></aside>
  <div class="toasts" id="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
